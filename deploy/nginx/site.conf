server {
  listen 80;
  server_name __VC_DOMAIN__ www.__VC_DOMAIN__;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  server_name __VC_DOMAIN__ www.__VC_DOMAIN__;

  ssl_certificate /etc/letsencrypt/live/__VC_DOMAIN__/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/__VC_DOMAIN__/privkey.pem;
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;
  ssl_session_tickets off;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    resolver 127.0.0.11;
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 30s;
  }

  # Compatibility for historical speed-test paths.
  location ~ ^/(settings/)?network[-_]benchmark/(latest|run)$ {
    return 307 /api/settings/network-benchmark/$2$is_args$args;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed static assets - cache for 1 year (immutable)
  location ~* /assets/.*\.(js|css|woff2|woff|ttf|eot)$ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # HTML files - no cache
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
  }

  # Service Worker - no cache
  location = /sw.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;
  }

  # Favicon and other non-hashed assets - cache for 1 day
  location ~* \.(ico|png|jpg|jpeg|gif|svg)$ {
    add_header Cache-Control "public, max-age=86400" always;
  }
}
