services:
  backend:
    image: python:3.11-slim
    working_dir: /app/backend
    volumes:
      - ..:/app
    env_file:
      - ../.env
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    command: /bin/sh -c "pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-21345}"
    ports:
      - "${PORT:-21345}:${PORT:-21345}"
