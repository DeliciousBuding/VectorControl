name: Release Consistency

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Main Release Consistency
        run: python scripts/check_main_release.py
